[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paint-defect-generator"
version = "0.1.0"
description = "Reproducible native-resolution paint defect baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.scripts]
defect-generator = "defect_generator.cli:main"

[tool.setuptools.packages.find]
include = ["defect_generator*"]
